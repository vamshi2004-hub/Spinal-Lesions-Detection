<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spinal Lesion Detection</title><style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        margin: 0;
        padding: 0;
    }

    .container {
        width: 90%;
        max-width: 650px;
        margin: 60px auto;
        background: white;
        padding: 35px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        text-align: center;
    }

    h1 {
        margin-bottom: 10px;
    }

    p {
        color: #555;
    }

    input[type="file"] {
        margin: 25px 0;
    }

    button {
        padding: 12px 25px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
    }

    .result {
        margin-top: 25px;
        padding: 15px;
        background: #f0f4f8;
        border-radius: 8px;
    }
</style>

</head><body><div class="container"><h1>Spinal Lesion Detection</h1>

<p>Upload a CT scan image to perform prediction.</p>

<form action="/predict" method="POST" enctype="multipart/form-data">

    <input type="file" name="file" accept="image/*" required>

    <br>

    <button type="submit">Predict</button>

</form>

{% if filename %}
    <div class="result">
        <h3>Uploaded Image</h3>
        <p>{{ filename }}</p>

        {% if prediction %}
            <h3>Prediction: {{ prediction }}</h3>
        {% endif %}
    </div>
{% endif %}

</div></body>
</html>
